# Play release pipeline — angus agents-chat (com.angussoftware.agentschat)
# Pattern: angus-tasks release.yml (proven end-to-end, Sep 2026). Build once,
# sign at the guard, upload via the /upload/ bundles endpoint, commit the edit.
when:
  - event: tag
    ref: refs/tags/v*
  - event: manual

steps:
  release:
    image: localhost:5000/ci-theming-emulator:latest
    environment:
      ANDROID_HOME: /opt/android-sdk
      AGENTSCHAT_KEYSTORE_B64:
        from_secret: AGENTSCHAT_KEYSTORE_B64
      AGENTSCHAT_KEYSTORE_PASSWORD:
        from_secret: AGENTSCHAT_KEYSTORE_PASSWORD
      AGENTSCHAT_KEY_ALIAS:
        from_secret: AGENTSCHAT_KEY_ALIAS
      AGENTSCHAT_KEY_PASSWORD:
        from_secret: AGENTSCHAT_KEY_PASSWORD
      # Play upload SA — rides the server WOODPECKER_ENVIRONMENT blob (machine-wide,
      # value-first key:value; delivered to every pipeline container as an env var
      # automatically — no from_secret, which reads only repo-level secrets).
      # Consumed ONLY via os.environ inside upload-play.py (post-#287 leak-proofing).
      # Track routing by tag suffix (default internal — the safe path):
      #   v0.4.2-rc1 / v0.4.2-beta (any -rc/-beta/-alpha suffix) -> internal
      #   v0.4.2 (clean vX.Y.Z tag)                                -> production
      # Manual runs always go internal (never an accidental prod ship).
      # PLAY_TRACK_FORCE: emergency override ONLY — a value containing
      # 'production' sends the run to production REGARDLESS of tag shape.
      # Use it only on Harry's explicit call during a release emergency;
      # keep it unset otherwise. (Substring match: exact 'production' or
      # empty — any other value must not contain that word.)
      PLAY_PACKAGE: com.angussoftware.agentschat
      PLAY_TRACK: internal
    commands:
      # JS toolchain: the fleet image is Kotlin/Gradle-only — node + bun ride a
      # cached volume (/opt/ci-tools). Node 22 LTS + bun latest, installed once.
      - |
        if [ ! -x /opt/ci-tools/node/bin/node ]; then
          mkdir -p /opt/ci-tools
          apt-get update > /dev/null 2>&1 && apt-get install -y curl xz-utils > /dev/null 2>&1
          curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz | tar -xJ -C /opt/ci-tools
          mv /opt/ci-tools/node-v22.14.0-linux-x64 /opt/ci-tools/node
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/opt/ci-tools/bun bash > /dev/null 2>&1
        fi
        export PATH=/opt/ci-tools/node/bin:/opt/ci-tools/bun/bin:$PATH
        node --version && bun --version
      # JS deps (node_modules for autolinking + codegen)
      - export PATH=/opt/ci-tools/node/bin:/opt/ci-tools/bun/bin:$PATH
      # --ignore-scripts: letta-code (peer dep of the SDK, auto-installed) carries node-pty whose
      # native postinstall breaks under node-gyp without npm metadata. The mobile app never executes
      # letta-code's native modules — RN autolinking + codegen run from node_modules at gradle time
      # (verified: full bundleRelease green on the scripts-skipped tree).
      - bun install --frozen-lockfile --ignore-scripts
      - mkdir -p ~/.gradle
      # Leak-proof signing setup (PR #80 pattern): keystore + credentials
      # consumed ONLY inside Python via os.environ; zero secret references
      # in shell command text.
      - |
        cat > /tmp/signing-setup.py << 'PYEOF'
        import base64, os, sys
        REQUIRED = ['AGENTSCHAT_KEYSTORE_B64', 'AGENTSCHAT_KEYSTORE_PASSWORD', 'AGENTSCHAT_KEY_ALIAS', 'AGENTSCHAT_KEY_PASSWORD']
        missing = [k for k in REQUIRED if not os.environ.get(k)]
        if missing:
            print('FATAL: missing signing env: ' + ', '.join(missing), file=sys.stderr)
            sys.exit(1)
        with open('/tmp/agentschat-release.jks', 'wb') as f:
            f.write(base64.b64decode(os.environ['AGENTSCHAT_KEYSTORE_B64']))
        os.chmod('/tmp/agentschat-release.jks', 0o600)
        # Export the Gradle-visible vars via /tmp/signing.env, sourced with no
        # expansion in command text.
        with open('/tmp/signing.env', 'w') as f:
            f.write('export PLAY_STORE_FILE=/tmp/agentschat-release.jks\n')
            f.write('export PLAY_STORE_PASSWORD=%s\n' % os.environ['AGENTSCHAT_KEYSTORE_PASSWORD'])
            f.write('export PLAY_KEY_ALIAS=%s\n' % os.environ['AGENTSCHAT_KEY_ALIAS'])
            f.write('export PLAY_KEY_PASSWORD=%s\n' % os.environ['AGENTSCHAT_KEY_PASSWORD'])
        os.chmod('/tmp/signing.env', 0o600)
        print('keystore + signing env ready (values not logged)')
        PYEOF
        python3 /tmp/signing-setup.py
      - echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      # Install Android SDK (cached via volume)
      - |
        if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
          apt-get update && apt-get install -y wget unzip > /dev/null 2>&1
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1
        else
          echo "Android SDK cached, skipping install"
        fi
      # Generate the android tree: only 2 files are force-tracked (build.gradle,
      # manifest); the full tree is prebuild-generated, never committed.
      # Prebuild regenerates build.gradle from the Expo template — WITHOUT the PR #90
      # signing guard — and the manifest WITHOUT our deep links (the updater
      # machinery incl. FileProvider + install permission is REMOVED; Play handles
      # updates). Restore BOTH tracked files: the tracked build.gradle
      # is the gate-cleared artifact (guard + printlns + versionCode =
      # the single source of release-version truth; bump in the repo, not in a regex).
      # Prebuild failure is FATAL, loud: this step generates the entire build tree.
      - |
        set -e
        export PATH=/opt/ci-tools/node/bin:/opt/ci-tools/bun/bin:$PATH
        npx expo prebuild --platform android --no-install || { echo "FATAL: expo prebuild failed" >&2; exit 1; }
        git checkout -- android/app/build.gradle android/app/src/main/AndroidManifest.xml
        # CANARY: the guard must be present in the restored file. If the tracked
        # build.gradle ever loses the guard, abort BEFORE any build/upload — the
        # first debug-keyed artifact Google sees can bind the upload identity.
        grep -q "SIGNING MODE: release keystore" android/app/build.gradle || { echo "FATAL: signing guard missing from build.gradle" >&2; exit 1; }
        # CANARY: the install permission must STAY absent. Prebuild regenerates
        # the manifest from app.json — if the updater permission ever reappears
        # (plugin regression, manifest regeneration), abort before upload.
        ! grep -q "REQUEST_INSTALL_PACKAGES" android/app/src/main/AndroidManifest.xml || { echo "FATAL: REQUEST_INSTALL_PACKAGES reappeared in manifest" >&2; exit 1; }
      - chmod +x android/gradlew
      # Clean stale Gradle locks from cached volumes (lesson #593)
      - rm -rf ~/.gradle/caches/journal-1 ~/.gradle/caches/*.lock
      # Build signed AAB — single path convention: workspace root.
      # The guard printlns SIGNING MODE; ORG_GRADLE_PROJECT_* vars are the
      # structurally leak-proof property channel (gradle reads them natively).
      - |
        set -e
        . /tmp/signing.env
        export ORG_GRADLE_PROJECT_PLAY_STORE_FILE="$PLAY_STORE_FILE"
        export ORG_GRADLE_PROJECT_PLAY_STORE_PASSWORD="$PLAY_STORE_PASSWORD"
        export ORG_GRADLE_PROJECT_PLAY_KEY_ALIAS="$PLAY_KEY_ALIAS"
        export ORG_GRADLE_PROJECT_PLAY_KEY_PASSWORD="$PLAY_KEY_PASSWORD"
        export PATH=/opt/ci-tools/node/bin:/opt/ci-tools/bun/bin:$PATH
        cd android
        ./gradlew app:bundleRelease -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease -x test --no-daemon > /tmp/build.log 2>&1 || { echo "FATAL: bundleRelease failed" >&2; exit 1; }
        cd ..
        # RUNTIME canary: the guard resolved RELEASE at build time (the static grep
        # proves the guard exists in source; this proves it fired). Redirect (not tee):
        # pipeline exit status in dash is the LAST command's — tee would swallow gradle's.
        grep -q "SIGNING MODE: release keystore" /tmp/build.log || { echo "FATAL: build resolved debug signing - aborting before upload" >&2; exit 1; }
        grep "SIGNING MODE" /tmp/build.log
        AAB_PATH=$(find android/app/build/outputs/bundle/release/ -name "*.aab" | head -1)
        if [ -z "$AAB_PATH" ]; then
          echo "FATAL: No AAB found after bundleRelease"
          ls -la android/app/build/outputs/bundle/release/ || true
          exit 1
        fi
        echo "AAB found: $AAB_PATH ($(wc -c < "$AAB_PATH") bytes)"
      # Upload AAB to Google Play internal track — FATAL on failure or skip
      # (AngusSoftwareApp lesson: non-fatal handling masked a broken upload
      # for ~10 days behind a green pipeline).
      - |
        set -e
        pip3 install --quiet --break-system-packages PyJWT cryptography requests 2>&1
        cat > /tmp/upload-play.py << 'PYEOF'
        import base64, json, os, re, sys
        from datetime import datetime, timedelta
        import jwt, requests
        SA_B64 = os.environ.get('GOOGLE_PLAY_SERVICE_ACCOUNT_B64', '')
        if not SA_B64:
            print('FATAL: GOOGLE_PLAY_SERVICE_ACCOUNT_B64 not set — Play upload secret missing', file=sys.stderr)
            sys.exit(1)
        KEY_FILE = json.loads(base64.b64decode(SA_B64))
        PACKAGE = os.environ.get('PLAY_PACKAGE', 'com.angussoftware.agentschat')
        TRACK = os.environ.get('PLAY_TRACK', 'internal')
        TIMEOUT = 300
        def check(r):
            if not r.ok:
                print(f'FAILED: {r.status_code}: {r.text}', file=sys.stderr)
                sys.exit(1)
        print('obtaining access token...')
        now = datetime.now()
        claim = {'iss': KEY_FILE['client_email'], 'scope': 'https://www.googleapis.com/auth/androidpublisher', 'aud': 'https://oauth2.googleapis.com/token', 'exp': str(int((now + timedelta(minutes=10)).timestamp())), 'iat': str(int(now.timestamp()))}
        assertion = jwt.encode(payload=claim, key=KEY_FILE['private_key'].encode(), algorithm='RS256', headers={'alg': 'RS256', 'typ': 'JWT'})
        r = requests.post('https://oauth2.googleapis.com/token', data={'grant_type': 'urn:ietf:params:oauth:grant-type:jwt-bearer', 'assertion': assertion}, timeout=TIMEOUT)
        check(r)
        token = r.json()['access_token']
        hdrs = {'Authorization': f'Bearer {token}'}
        print('creating edit...')
        r = requests.post(f'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PACKAGE}/edits', json={'expiryTimeSeconds': str(int((now + timedelta(minutes=10)).timestamp()))}, headers=hdrs, timeout=TIMEOUT)
        check(r)
        edit_id = r.json()['id']
        print(f'edit_id={edit_id}')
        print('uploading aab (bundles endpoint, media upload)...')
        with open(os.environ['AAB_PATH'], 'rb') as f:
            r = requests.post(f'https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/{PACKAGE}/edits/{edit_id}/bundles', data=f.read(), headers={**hdrs, 'Content-Type': 'application/octet-stream'}, timeout=TIMEOUT)
        check(r)
        vc = r.json()['versionCode']
        print(f'uploaded version_code={vc}')
        release = {'versionCodes': [str(vc)]}
        tag = os.environ.get('CI_COMMIT_TAG', '')
        if tag:
            release['name'] = tag
        # Track routing: clean vX.Y.Z tags promote to production; any
        # pre-release suffix (-rc/-beta/-alpha) stays internal. Deriving
        # from the tag keeps the pipeline's declared default (internal)
        # authoritative for manual and unexpected runs.
        if TRACK == 'production' or 'production' in os.environ.get('PLAY_TRACK_FORCE', ''):
            TRACK = 'production'
        else:
            is_clean_tag = bool(re.fullmatch(r'v\d+\.\d+\.\d+', tag)) if tag else False
            if is_clean_tag:
                TRACK = 'production'
        print(f'assigning to {TRACK} track...')
        # First release on a track of a draft app must land as status=draft
        # ("Only releases with status draft may be created on draft app",
        # INVALID_ARGUMENT 400, first v0.4.2 production fire). Once the app
        # is released through Play Console once (production promote), the
        # 'completed' status works. Heuristic: try completed; on the draft
        # rejection, retry the release with status='draft'.
        release['status'] = 'completed'
        r = requests.put(f'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PACKAGE}/edits/{edit_id}/tracks/{TRACK}', json={'releases': [release]}, headers={**hdrs, 'Content-Type': 'application/json'}, timeout=TIMEOUT)
        check(r)
        print(f'assigned to {TRACK} (release status: {release["status"]})')
        print('committing edit...')
        r = requests.post(f'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PACKAGE}/edits/{edit_id}:commit', headers=hdrs, timeout=TIMEOUT)
        # The draft-app rule is enforced at EDIT COMMIT, not at the tracks
        # PUT (measured twice: pipelines 18 and 19 both accepted
        # 'completed' at assignment and were rejected at commit with
        # "Only releases with status draft may be created on draft app").
        # First-ever release on a track of a draft app must be status=draft.
        if r.status_code == 400 and 'draft app' in r.text:
            print('draft-app rule hit at edit commit: retrying with status=draft')
            release['status'] = 'draft'
            r = requests.put(f'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PACKAGE}/edits/{edit_id}/tracks/{TRACK}', json={'releases': [release]}, headers={**hdrs, 'Content-Type': 'application/json'}, timeout=TIMEOUT)
            check(r)
            print(f'reassigned to {TRACK} (release status: {release["status"]})')
            r = requests.post(f'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PACKAGE}/edits/{edit_id}:commit', headers=hdrs, timeout=TIMEOUT)
        check(r)
        print(f'DONE - published {vc} to {TRACK}')
        PYEOF
        export AAB_PATH
        python3 /tmp/upload-play.py
        echo "Play Store upload and publish successful"
        rm -f /tmp/upload-play.py /tmp/agentschat-release.jks /tmp/signing.env
    volumes:
      - gradle-cache-agentschat-release:/root/.gradle/caches
      - gradle-wrapper-agentschat-release:/root/.gradle/wrapper
      - android-sdk-agentschat-release:/opt/android-sdk
      - ci-tools-agentschat-release:/opt/ci-tools
