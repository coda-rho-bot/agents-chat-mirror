# Play release pipeline — angus agents-chat (com.angussoftware.agentschat)
# Pattern: ASA/Tasks (tag-driven, build once, internal track).
# Secrets: AGENTSCHAT_KEYSTORE_B64/PASSWORD/KEY_ALIAS/KEY_PASSWORD (repo 13)
#          GOOGLE_PLAY_SERVICE_ACCOUNT_B64 (server env blob)
steps:
  - name: build-aab
    image: oven/bun:1
    commands:
      # The guard prints SIGNING MODE; partial secrets fail at config time; all-four signs release.
      - cd android
      - |
        echo "$AGENTSCHAT_KEYSTORE_B64" | base64 -d > /tmp/agentschat-release.jks
        ANDROID_HOME=/opt/android-sdk JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 \
        ./gradlew app:bundleRelease -x lint -x lintVitalAnalyzeRelease -x lintVitalRelease -x test \
          -PreactNativeArchitectures=arm64-v8a \
          -PPLAY_STORE_FILE=/tmp/agentschat-release.jks \
          -PPLAY_STORE_PASSWORD=$AGENTSCHAT_KEYSTORE_PASSWORD \
          -PPLAY_KEY_ALIAS=$AGENTSCHAT_KEY_ALIAS \
          -PPLAY_KEY_PASSWORD=$AGENTSCHAT_KEY_PASSWORD
      - test -f android/app/build/outputs/bundle/release/app-release.aab || (echo "FATAL: no AAB"; exit 1)
      - cp android/app/build/outputs/bundle/release/app-release.aab /tmp/app-release.aab

  - name: upload-internal
    image: python:3.12-alpine
    commands:
      - pip install --quiet google-auth
      - |
        python3 - << 'PY'
        import json, os, base64, time, urllib.request, subprocess
        sa = json.loads(base64.b64decode(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_B64"]))
        from google.oauth2 import service_account
        from google.auth.transport.requests import Request
        creds = service_account.Credentials.from_service_account_info(
            sa, scopes=["https://www.googleapis.com/auth/androidpublisher"])
        creds.refresh(Request())
        tok = creds.token

        PKG = "com.angussoftware.agentschat"
        BASE = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{PKG}"

        # 1. open an edit
        req = urllib.request.Request(f"{BASE}/edits", method="POST",
              data=json.dumps({}).encode(),
              headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
        edit = json.load(urllib.request.urlopen(req))
        edit_id = edit["id"]
        print("edit", edit_id)

        # 2. upload the AAB
        aab = open("/tmp/app-release.aab", "rb").read()
        boundary = "woodpecker-play-upload"
        body = (f"--{boundary}\r\n"
                "Content-Type: application/octet-stream\r\n\r\n").encode() + aab + f"\r\n--{boundary}--\r\n".encode()
        req = urllib.request.Request(
            f"{BASE}/edits/{edit_id}/apks",
            data=body, method="POST",
            headers={"Authorization": f"Bearer {tok}",
                     "Content-Type": f"multipart/related; boundary={boundary}"})
        apk = json.load(urllib.request.urlopen(req))
        version_code = apk["versionCode"]
        print("uploaded versionCode", version_code)

        # 3. assign to internal track
        release_name = os.environ.get("CI_COMMIT_TAG", f"build-{version_code}")
        req = urllib.request.Request(
            f"{BASE}/edits/{edit_id}/tracks/internal",
            data=json.dumps({"releases": [{
                "name": release_name,
                "versionCodes": [str(version_code)],
                "status": "completed",
            }]}).encode(), method="PUT",
            headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
        urllib.request.urlopen(req)
        print("assigned to internal track")

        # 4. commit the edit
        req = urllib.request.Request(
            f"{BASE}/edits/{edit_id}", method="POST",
            data=json.dumps({}).encode(),
            headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"})
        urllib.request.urlopen(req)
        print("EDIT COMMITTED — live on internal track")
        PY

when:
  event: [tag, manual]
